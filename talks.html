<body><header class="top"><div class="wrap">
  <a class="brand" href="index.html"><span class="sq" aria-hidden="true"></span>Emilia Millón</a>
  <nav class="tabs" aria-label="Pages"><a href="index.html">CV</a><a href="talks.html" aria-current="page">Talks &amp; seminars</a></nav>
</div></header>
<main>
<section class="page-head"><div class="wrap">
  <p class="kicker"><span class="sq" aria-hidden="true"></span>Talks &amp; seminars</p>
  <h1>On the road</h1>
  <p class="intro">Moments from seminars, conferences, workshops and presentations.</p>
</div></section>
<div class="wrap" id="gallery"><noscript>Enable JavaScript to see the gallery.</noscript></div>
</main>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="x" type="button" aria-label="Close">✕</button>
  <button class="prev" type="button" aria-label="Previous">←</button>
  <figure><img alt=""><figcaption></figcaption></figure>
  <button class="next" type="button" aria-label="Next">→</button>
</div>
<footer class="foot"><div class="wrap">
  <span>Emilia Millón &nbsp;/&nbsp; <a href="mailto:emillon@face.unt.edu.ar">emillon@face.unt.edu.ar</a></span>
  <span>Last updated November 2026 <span class="sq" aria-hidden="true"></span></span>
</div></footer>
<script src="assets/gallery/gallery-data.js"></script>
<script>
(function(){
  var data=(window.GALLERY||[]).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var root=document.getElementById('gallery'), byYear={}, years=[], withImg=[];
  function e(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
  function nice(d){if(!d)return'';var p=d.split('-');var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return (p[1]?m[+p[1]-1]+' ':'')+p[0];}
  data.forEach(function(x){var y=(x.date||'').slice(0,4)||'—';if(!byYear[y]){byYear[y]=[];years.push(y);}byYear[y].push(x);});
  var html='';
  years.forEach(function(y){
    html+='<h2 class="year"><span class="sq" aria-hidden="true"></span>'+e(y)+'</h2><div class="grid">';
    byYear[y].forEach(function(x){
      var cap='<figcaption><span class="when">'+e(nice(x.date))+'</span><span class="what">'+e(x.title)+'</span><span class="where">'+e(x.event)+(x.place?' · '+e(x.place):'')+'</span></figcaption>';
      if(x.src){var i=withImg.length;withImg.push(x);
        html+='<figure class="card"><button type="button" data-i="'+i+'" aria-label="Open photo: '+e(x.title)+'"><img class="thumb" loading="lazy" src="assets/gallery/'+encodeURI(x.src)+'" alt="'+e(x.alt||x.title)+'"></button>'+cap+'</figure>';}
      else html+='<figure class="card"><div class="ph">Photo coming soon</div>'+cap+'</figure>';
    });
    html+='</div>';
  });
  root.innerHTML=html||'<p>No photos yet.</p>';
  var lb=document.getElementById('lb'),img=lb.querySelector('img'),fc=lb.querySelector('figcaption'),cur=0,last=null;
  function show(i){cur=(i+withImg.length)%withImg.length;var x=withImg[cur];img.src='assets/gallery/'+encodeURI(x.src);img.alt=x.alt||x.title;fc.textContent=nice(x.date)+' · '+x.title+' — '+x.event+(x.place?', '+x.place:'');}
  function open(i){last=document.activeElement;show(i);lb.hidden=false;lb.querySelector('.x').focus();}
  function close(){lb.hidden=true;if(last)last.focus();}
  root.addEventListener('click',function(ev){var b=ev.target.closest('button[data-i]');if(b)open(+b.dataset.i);});
  lb.querySelector('.x').onclick=close;lb.querySelector('.prev').onclick=function(){show(cur-1);};lb.querySelector('.next').onclick=function(){show(cur+1);};
  lb.addEventListener('click',function(ev){if(ev.target===lb)close();});
  document.addEventListener('keydown',function(ev){if(lb.hidden)return;if(ev.key==='Escape')close();if(ev.key==='ArrowLeft')show(cur-1);if(ev.key==='ArrowRight')show(cur+1);});
})();
</script>
</body></html>
